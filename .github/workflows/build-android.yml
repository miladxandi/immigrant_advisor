name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - 'ImmigrantAdvisor.Maui/**'
      - 'ImmigrantAdvisor.Shared/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '11.0.x'

    - name: Install MAUI workloads
      run: |
        dotnet workload install android
        dotnet workload install maui-android

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'

    - name: Decode Keystore
      if: github.event_name != 'pull_request'
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > immigrant_advisor.keystore
      working-directory: ImmigrantAdvisor.Maui

    - name: Build Android APK (Unsigned for PR)
      if: github.event_name == 'pull_request'
      run: |
        dotnet publish ImmigrantAdvisor.Maui/ImmigrantAdvisor.Maui.csproj \
          -c Release \
          -f net11.0-android \
          -o ./publish \
          -p:AndroidPackageFormat=apk

    - name: Build Android APK (Signed)
      if: github.event_name != 'pull_request'
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        dotnet publish ImmigrantAdvisor.Maui/ImmigrantAdvisor.Maui.csproj \
          -c Release \
          -f net11.0-android \
          -o ./publish \
          -p:AndroidPackageFormat=apk \
          -p:AndroidKeyStore=true \
          -p:AndroidSigningKeyStore=immigrant_advisor.keystore \
          -p:AndroidSigningKeyAlias=$KEYSTORE_ALIAS \
          -p:AndroidSigningKeyPass=$KEY_PASSWORD \
          -p:AndroidSigningStorePass=$KEYSTORE_PASSWORD
      working-directory: .

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: ImmigrantAdvisor-Android-APK
        path: publish/*-Signed.apk
        retention-days: 30
        if-no-files-found: warn

    - name: Upload Unsigned APK (PR only)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: ImmigrantAdvisor-Android-APK-Unsigned
        path: publish/*.apk
        retention-days: 14
        if-no-files-found: warn
